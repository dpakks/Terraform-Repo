name: TerraGuard Terraform Plan

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  terraform-plan:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      TERRAGUARD_WEBHOOK_URL: ${{ secrets.TERRAGUARD_WEBHOOK_URL }}

    steps:
      - name: Checkout Pull Request Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -out=tfplan \
            -var="aws_region=${{ secrets.AWS_REGION }}"

      - name: Convert Terraform Plan to JSON
        run: terraform show -json tfplan > tfplan.json

      - name: Send Terraform Plan + Source Files to TerraGuard
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          python <<'EOF'
          import json
          import os
          import urllib.request

          with open("tfplan.json", "r") as f:
              plan = json.load(f)

          # Read the raw source files Agent 2 will rewrite.
          # Add any new .tf files here if the repo grows.
          source_files = {}
          for path in ["main.tf", "variables.tf"]:
              if os.path.exists(path):
                  with open(path, "r") as sf:
                      source_files[path] = sf.read()

          payload = {
              "pr_number": int(os.environ["PR_NUMBER"]),
              "author": os.environ["PR_AUTHOR"],
              "repo_name": os.environ["REPO_NAME"],
              "branch_name": os.environ["BRANCH_NAME"],
              "terraform_plan": plan,
              "terraform_files": source_files
          }

          req = urllib.request.Request(
              os.environ["TERRAGUARD_WEBHOOK_URL"],
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  "ngrok-skip-browser-warning": "true"
              },
              method="POST"
          )

          with urllib.request.urlopen(req) as response:
              print(response.read().decode())
          EOF
